<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/src/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/src/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/src/favicon/site.webmanifest" />
    <title>ebk music</title>
    <link rel="stylesheet" href="/src/css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="/src/css/music-page.css?v=20260904">
    <script src="https://cdn.jsdelivr.net/gh/lumilovesyou/Gleebus-Webring@main/webring.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="/src/js/musicMenu.js?v=20260904" defer></script>
</head>
<body>
    <header class="pfp">
        <div class="pfp-left">
            <a href="/" class="homepage">
                <img src="/src/favicon/cover-major_hommy_For_Those_Who_Smirk.png" class="pfp-pic">
            </a>
            <span class="pfp-brand"></span>
            
            <h2 class="typing">>_Music</h2><span class="cursor">__</span>
        </div>
        <div class="webring">
            <a href="https://1crizer.dingusblingus.cc" target="_blank"><img src="https://crizer.dingusblingus.cc/images/88x31.png" alt="crizer"></a>
            <a href="https://lumiverse.dev/" target="_blank"><img src="https://lumiverse.dev/assets/88x31/mine/lumi-88x31.gif" alt="lumi"></a>
            <a href="https://dev-site.homecamp.biz/" target="_blank"><img src="https://crizer.dingusblingus.cc/images/qd8jh44.gif" alt="dev-site"></a>
            <a href="https://schlumbis.dev/" target="_blank"><img src="https://schlumbis.dev/src/img/gaia.gif" alt="schlumbis"></a>
            <button onclick="gleebusOpen(-1)">Previous</button>
            Gleebus Webring
            <button onclick="gleebusOpen(1)">next</button>
        </div>
        <div class="links">
            <a href="https://www.albumoftheyear.org/user/zxrkcr/" target="_blank"> <img src="/src/favicon/AOTY.jpg" class="AOTY"></a>
            <a href="https://open.spotify.com/user/312fi2w6eolnvwoixqdmuff7c4s4?si=5c6d82b66673422a" target="_blank"> <img src="/src/favicon/spotify.png" class="spotify"></a>
            <a href="https://www.instagram.com/zxrkcr/" target="_blank"> <img src="/src/favicon/insta.png" class="insta"></a>
            <a href="https://discord.com/users/973454592241188934" target="_blank"> <img src="/src/favicon/discord.png" class="dis-cord"></a>
        </div>
    </header>

    <div class="music-menu">
        <div class="screen active" id="landing">
            <div class="cover-scatter" id="coverScatter"></div>
            <div class="logo" id="logoText"></div>
            <button class="start-btn" id="startBtn"><span class="pixel-tri play-icon"></span> PLAY</button>
        </div>

        <div class="screen" id="browse">
            <div class="back-hint" style="font-size: 25px;">
                Esc to go back
                <div class="controls-hint" style="font-size: 25px;">
                    <span><b>←/→</b> songs</span>
                    <span><b>A/D</b> artists</span>
                    <span><b>Space</b> play/pause</span>
                </div>
            </div>

            <div class="artist-side">
                <button class="artist-arrow prev" id="artistPrev"><span class="pixel-tri flip"></span></button>
                <div class="swiper artist-swiper" id="artistSwiper"><div class="swiper-wrapper" id="artistWrapper"></div></div>
                <button class="artist-arrow next" id="artistNext"><span class="pixel-tri"></span></button>
            </div>

            <div class="song-side">
                <div class="pick-label">PICK A SONG</div>
                <div class="swiper song-swiper" id="songSwiper"><div class="swiper-wrapper" id="songWrapper"></div></div>
                <div class="track-row">
                    <button class="track-arrow" id="songPrev"><span class="pixel-tri flip"></span></button>
                    <div class="track-title" id="trackTitle">—</div>
                    <button class="track-arrow" id="songNext"><span class="pixel-tri"></span></button>
                </div>
                <div class="transport">
                    <button class="play-btn" id="playBtn"><span class="pixel-tri play-icon"></span> PLAY</button>
                    <div class="bar-wrap" id="barWrap"><div class="bar-fill" id="barFill"></div><div class="bar-thumb" id="barThumb"></div></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
